# panel-loop judge switches. One line per judge: <name>=true|false.
# No code change needed to toggle. Overrides, first found wins per judge:
#   $PANEL_LOOP_JUDGE_<NAME>=true|false   (e.g. PANEL_LOOP_JUDGE_CLEF_FLASH=false)
#   judge.<name>=true|false in ~/.config/clef-decide/config
#   this file (or the one named by $PANEL_LOOP_JUDGES_FILE)
# A missing line means on. --panel votes with the judges that are on.
clef=true
clef-flash=true
jev=true
luna=true
